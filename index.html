<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="description" content="Moodi бол чиний хөөрхөн 3D найз. Илбэ, хоолло, тогло, бас найздаа Moodi захиа илгээ 💌">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MOODI">
<meta property="og:title" content="💌 Чамд Moodi захиа ирлээ!">
<meta property="og:description" content="Нээгээд үзээрэй, хөөрхөн Moodi чамд захиа уншиж өгнө 🥰">
<meta property="og:image" content="https://moodi-vert.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://moodi-vert.vercel.app/">

<meta name="twitter:image" content="https://moodi-vert.vercel.app/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="MOODI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3b2740; --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: #ffe3ee;
    font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--ink);
    touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── арын фон: хоёр давхарга ээлжлэн бүдгэрнэ (утсан дээр хямд) ── */
  .bg { position: fixed; inset: 0; transition: opacity .9s ease; will-change: opacity; }
  #bgB { opacity: 0; }
  .dots {
    position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(59,39,64,.09) 1.6px, transparent 1.8px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 40%, #000 88%);
            mask-image: linear-gradient(to bottom, transparent 40%, #000 88%);
  }
  .bokeh { position: fixed; border-radius: 50%; pointer-events: none; will-change: transform;
    background: radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 68%); }
  .k1 { width: 340px; height: 340px; left: -120px; top: 8%; animation: drift1 16s ease-in-out infinite alternate; }
  .k2 { width: 260px; height: 260px; right: -90px; top: 30%; animation: drift2 19s ease-in-out infinite alternate; }
  .k3 { width: 200px; height: 200px; left: 30%; top: -60px; animation: drift1 23s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate3d(80px, 60px, 0) scale(1.15); } }
  @keyframes drift2 { to { transform: translate3d(-70px, -50px, 0) scale(.9); } }

  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ── HUD ── */
  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    padding: calc(var(--safe-t) + 14px) 16px 0; pointer-events: none;
  }
  .brand b { display: inline-block; font-size: 25px; letter-spacing: .1em; font-weight: 900; line-height: 1;
    background: linear-gradient(90deg, #ff5c93, #a78bfa, #38bdf8, #ff5c93); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: holo 6s linear infinite; filter: drop-shadow(0 2px 0 rgba(59,39,64,.35)); }
  @keyframes holo { to { background-position: 300% 0; } }
  .brand > span { display: block; font-size: 12px; font-weight: 700; opacity: .6; margin-top: 3px; }
  .love { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .love .heart { font-size: 15px; display: inline-block; }
  .love .bar { width: 78px; height: 9px; border-radius: 9px; background: rgba(255,255,255,.7); border: 2px solid var(--ink); overflow: hidden; }
  .love .bar i { display: block; height: 100%; width: 50%; border-radius: 9px; background: linear-gradient(90deg, #ff8fb8, #ff5c93); transition: width .5s cubic-bezier(.3,1.5,.5,1); }
  .love small { font-size: 11px; font-weight: 800; opacity: .75; white-space: nowrap; }
  .right { display: flex; gap: 8px; pointer-events: auto; }
  .chip, .icon {
    font: inherit; color: inherit; background: #fff; cursor: pointer;
    border: 2.5px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink);
    padding: 6px 12px; display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px;
    transition: transform .12s, box-shadow .12s;
  }
  .icon { padding: 6px 10px; }
  .chip:active, .icon:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  #moodEmoji { font-size: 18px; display: inline-block; }
  .pop { animation: pop .45s cubic-bezier(.3,1.8,.5,1); }
  @keyframes pop { 0% { transform: scale(.3) rotate(-25deg); } 100% { transform: scale(1); } }

  /* ── ярианы бөмбөлөг ── */
  #bubble { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .18s; will-change: transform; }
  #bubble.on { opacity: 1; }
  #bubble .bi {
    position: relative; background: #fff; border: 2.5px solid var(--ink); border-radius: 20px;
    box-shadow: 0 4px 0 var(--ink); padding: 9px 15px; font-weight: 800; font-size: 17px; line-height: 1.25;
    width: max-content; max-width: min(290px, calc(100vw - 40px)); text-align: center; --tx: 0px;
  }
  #bubble .bi::after {
    content: ''; position: absolute; left: calc(50% + var(--tx)); bottom: -9px; width: 14px; height: 14px;
    background: #fff; border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink);
    transform: translateX(-50%) rotate(45deg);
  }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .fx { position: fixed; left: 0; top: 0; line-height: 1; will-change: transform, opacity; }
  .ripple { position: fixed; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 3px solid var(--ink); border-radius: 50%; }

  /* ── заавар ── */
  #hint {
    position: fixed; left: 0; right: 0; z-index: 2; text-align: center; font-size: 13px; font-weight: 800;
    bottom: calc(var(--safe-b) + 166px); opacity: .55; transition: opacity .6s; pointer-events: none;
  }
  #hint.gone { opacity: 0; }
  #coach {
    position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .4s;
    display: flex; flex-direction: column; align-items: center; gap: 2px; will-change: transform;
  }
  #coach.on { opacity: 1; }
  #coach .f { font-size: 40px; animation: tapme 1.1s ease-in-out infinite; filter: drop-shadow(0 3px 0 rgba(59,39,64,.25)); }
  #coach span { background: var(--ink); color: #fff; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 99px; }
  @keyframes tapme { 0%,100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-14px) scale(1.05); } 60% { transform: translateY(0) scale(.9); } }

  /* ── доод товчнууд ── */
  .dock {
    position: fixed; left: 50%; z-index: 5; transform: translateX(-50%);
    bottom: calc(var(--safe-b) + 16px); display: flex; gap: 10px;
  }
  .dock button {
    font: inherit; color: inherit; width: 64px; height: 70px; border-radius: 22px; cursor: pointer; padding: 0;
    background: var(--c, #fff); border: 2.5px solid var(--ink); box-shadow: 0 5px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-weight: 900; font-size: 10px; letter-spacing: .03em;
    transition: transform .12s cubic-bezier(.3,1.6,.5,1), box-shadow .12s;
  }
  .dock { gap: 8px; }
  .dock button:active { transform: translateY(4px) scale(.94); box-shadow: 0 1px 0 var(--ink); }
  .dock button.sel { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .dock i { font-style: normal; font-size: 27px; line-height: 1; display: inline-block; }
  .dock button.boing i { animation: wiggle .5s cubic-bezier(.3,1.8,.5,1); }
  @keyframes wiggle { 0% { transform: scale(.6) rotate(-20deg); } 60% { transform: scale(1.25) rotate(10deg); } 100% { transform: scale(1); } }
  .dock [data-act=pet]   { --c: #ffd6e6; }
  .dock [data-act=food]  { --c: #fff0b8; }
  .dock [data-act=ball]  { --c: #d4f5e6; }
  .dock [data-act=photo] { --c: #d8ecff; }
  .dock [data-act=vibe]  { --c: #e7dcff; }

  /* ── хоолны цэс ── */
  #tray {
    position: fixed; left: 50%; z-index: 6; bottom: calc(var(--safe-b) + 100px);
    transform: translate(-50%, 18px) scale(.9); opacity: 0; pointer-events: none;
    display: flex; gap: 5px; padding: 7px; background: #fff; border: 2.5px solid var(--ink); border-radius: 22px;
    box-shadow: 0 4px 0 var(--ink); transition: transform .28s cubic-bezier(.3,1.5,.5,1), opacity .2s;
    max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none;
  }
  #tray.on { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  #tray button {
    font: inherit; color: var(--ink); border: 0; background: #fff4f8; border-radius: 14px; flex: 0 0 auto;
    width: 43px; height: 54px; padding: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 24px;
    transition: transform .12s;
  }
  #tray button small { font-size: 8px; font-weight: 900; }
  #tray button.fav { background: #fff3c4; box-shadow: inset 0 0 0 2px #ffcf4d; }
  #tray button:active { transform: scale(.85); }

  /* ── зургийн дэлгэц ── */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 14; }
  #photo {
    position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; padding: 20px;
    background: rgba(59,39,64,.6); opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s;
  }
  #photo.on { opacity: 1; visibility: visible; }
  #photo .card { display: flex; flex-direction: column; align-items: center; gap: 14px; transform: scale(.6) rotate(-12deg); transition: transform .55s cubic-bezier(.3,1.6,.5,1); }
  #photo.on .card { transform: scale(1) rotate(-3deg); }
  #photo img {
    max-height: 68vh; object-fit: contain;
    width: min(76vw, 340px); border-radius: 6px; box-shadow: 0 14px 34px rgba(0,0,0,.35);
    -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
  }
  #photo .row { display: flex; gap: 10px; transform: rotate(3deg); }
  #photo .row a, #photo .row button {
    font: inherit; color: var(--ink); text-decoration: none; background: #fff; cursor: pointer;
    border: 2.5px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); padding: 9px 16px; font-weight: 900; font-size: 15px;
  }
  #photo p { margin: 0; color: #fff; font-weight: 800; font-size: 12px; opacity: .8; transform: rotate(3deg); }

  /* ── ачаалах дэлгэц ── */
  #splash {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: radial-gradient(130% 85% at 50% 30%, #ffe3ee, #d8ecff); transition: opacity .6s, visibility .6s;
  }
  #splash.out { opacity: 0; visibility: hidden; }
  #splash .logo { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 0 24px; }
  #splash .blob {
    width: 92px; height: 92px; border-radius: 50%; background: #9fe6cc; border: 3px solid var(--ink);
    position: relative; animation: hop .9s cubic-bezier(.3,0,.5,1) infinite;
    box-shadow: inset -10px -12px 0 rgba(59,39,64,.12);
  }
  #splash .blob i { position: absolute; top: 34px; width: 14px; height: 18px; border-radius: 50%; background: var(--ink); animation: blink 2.4s infinite; }
  #splash .blob i:first-child { left: 26px; } #splash .blob i:last-child { right: 26px; }
  #splash b { font-size: 30px; font-weight: 900; letter-spacing: .14em; }
  #splash small { font-size: 14px; font-weight: 800; opacity: .6; }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.06, .94); } 50% { transform: translateY(-26px) scale(.95, 1.05); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

  .dock [data-act=game]  { --c: #e7dcff; }

  /* ── тоглоомын хуудас (доороос гарч ирнэ) ── */
  #sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 8; width: min(100%, 560px);
    background: #fff; border: 2.5px solid var(--ink); border-bottom: 0; border-radius: 26px 26px 0 0;
    box-shadow: 0 -6px 0 rgba(59,39,64,.12); height: min(54vh, 500px);
    display: flex; flex-direction: column; padding-bottom: var(--safe-b);
    transform: translate(-50%, 105%); transition: transform .4s cubic-bezier(.3,1.15,.5,1);
  }
  #sheet.on { transform: translate(-50%, 0); }
  .sh-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; }
  .sh-head b { flex: 1; text-align: center; font-size: 18px; font-weight: 900; }
  .sh-head button {
    font: inherit; color: var(--ink); width: 38px; height: 38px; border-radius: 50%; background: #fff4f8; cursor: pointer;
    border: 2.5px solid var(--ink); box-shadow: 0 2px 0 var(--ink); font-weight: 900; font-size: 16px; padding: 0;
  }
  #shBody { flex: 1; overflow-y: auto; padding: 6px 16px 18px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .game {
    font: inherit; color: inherit; background: var(--c); border: 2.5px solid var(--ink); border-radius: 18px; cursor: pointer;
    box-shadow: 0 3px 0 var(--ink); padding: 10px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    animation: popIn .4s cubic-bezier(.3,1.6,.5,1) backwards;
  }
  .game:active, .btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .game i { font-style: normal; font-size: 30px; line-height: 1.1; }
  .game b { font-size: 12.5px; font-weight: 900; }
  .game small { font-size: 10px; opacity: .65; font-weight: 700; text-align: center; line-height: 1.15; }
  @keyframes popIn { from { transform: scale(.5); opacity: 0; } }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row2 { display: flex; gap: 8px; } .row2 > * { flex: 1; }
  .lead { margin: 0; font-weight: 800; font-size: 15px; text-align: center; line-height: 1.35; }
  .sub { margin: 4px 0 0; font-weight: 800; font-size: 12px; opacity: .6; text-align: center; }
  .btn {
    font: inherit; font-weight: 900; font-size: 15px; color: var(--ink); background: var(--c, #fff); cursor: pointer;
    border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 0 3px 0 var(--ink); padding: 11px 12px;
    transition: background .2s;
  }
  .btn:disabled { opacity: .45; }
  .btn.ok { background: #b8f0c8; } .btn.bad { background: #ffb3b3; }
  .inp {
    font: inherit; font-weight: 800; font-size: 16px; width: 100%; padding: 11px 14px; color: var(--ink);
    border: 2.5px solid var(--ink); border-radius: 14px; background: #fff8fb; outline: none;
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
  }
  .inp:focus { background: #fff; box-shadow: 0 0 0 4px #ffd6e6; }
  .fortune { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .fortune li {
    display: flex; gap: 10px; align-items: center; background: #f7f2ff; border-radius: 14px; padding: 8px 12px;
    animation: popIn .45s cubic-bezier(.3,1.6,.5,1) backwards;
  }
  .fortune li i { font-style: normal; font-size: 24px; }
  .fortune li small { display: block; font-size: 11px; font-weight: 800; opacity: .55; }
  .fortune li b { font-size: 15px; font-weight: 900; }
  .big { font-size: 58px; font-weight: 900; text-align: center; line-height: 1.1; }
  .score { display: flex; justify-content: space-around; font-weight: 900; font-size: 17px; background: #f7f2ff; border-radius: 14px; padding: 8px; }
  .arena { display: flex; align-items: center; justify-content: center; gap: 22px; font-size: 60px; min-height: 84px; }
  .arena .vs { font-size: 18px; font-weight: 900; opacity: .5; }
  .shake { animation: shk .3s ease-in-out 3; display: inline-block; }
  @keyframes shk { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(-12deg); } }
  .rx {
    height: 150px; border-radius: 22px; border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
    display: grid; place-items: center; text-align: center; font-size: 22px; font-weight: 900; color: #fff; cursor: pointer;
    background: #a99bd6; touch-action: manipulation; transition: background .1s;
  }
  .rx.wait { background: #ff6b6b; } .rx.go { background: #2ecc71; }
  .tapbig { height: 130px; font-size: 30px; border-radius: 26px; --c: #ffd6e6; touch-action: manipulation; }
  .bar { height: 12px; border: 2.5px solid var(--ink); border-radius: 10px; overflow: hidden; background: #fff; }
  .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #5cc8ff, #ff8fb8); }
  .ans { font-size: 22px; font-weight: 900; text-align: center; min-height: 34px; }

  /* ── 3D тоглоомын горим ── */
  .hud, .dock, #hint { transition: opacity .3s, visibility .3s; }
  body.gm .hud, body.gm .dock, body.gm #hint { opacity: 0; visibility: hidden; }
  #gbar {
    position: fixed; left: 50%; top: calc(var(--safe-t) + 12px); z-index: 9; transform: translate(-50%, -160%);
    display: flex; align-items: center; gap: 8px; width: min(94vw, 420px);
    background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); padding: 5px;
    transition: transform .4s cubic-bezier(.3,1.5,.5,1);
  }
  body.gm #gbar { transform: translate(-50%, 0); }
  #gbar > div { flex: 1; text-align: center; line-height: 1.15; min-width: 0; }
  #gbar b { display: block; font-size: 16px; font-weight: 900; letter-spacing: .01em; }
  #gbar small { display: block; font-size: 12px; font-weight: 800; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gbar button {
    font: inherit; color: var(--ink); width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; padding: 0; cursor: pointer;
    background: #fff4f8; border: 2.5px solid var(--ink); font-weight: 900; font-size: 16px;
  }
  #gctl {
    position: fixed; left: 50%; bottom: calc(var(--safe-b) + 14px); z-index: 9; width: min(94vw, 480px);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    transform: translate(-50%, 180%); transition: transform .4s cubic-bezier(.3,1.3,.5,1);
  }
  body.gm #gctl { transform: translate(-50%, 0); }
  #gctl .inp { flex: 1 1 150px; width: auto; }
  .gc {
    font: inherit; font-weight: 900; font-size: 15px; color: var(--ink); background: var(--c, #fff); cursor: pointer;
    border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 0 3px 0 var(--ink); padding: 10px 14px;
    animation: popIn .35s cubic-bezier(.3,1.6,.5,1) backwards; touch-action: manipulation;
  }
  .gc.big { font-size: 34px; padding: 6px 20px; }
  .gc.big small { display: block; font-size: 11px; font-weight: 900; margin-top: 2px; }
  .gc:disabled { opacity: .45; }
  .gpick { flex: 1 1 100%; display: flex; align-items: center; gap: 8px; background: #fff; border: 2.5px solid var(--ink); border-radius: 22px; box-shadow: 0 3px 0 var(--ink); padding: 8px; }
  .gpick .gc { flex: 0 0 54px; height: 54px; padding: 0; font-size: 30px; line-height: 1; border-radius: 16px; }
  .gpi { flex: 1; min-width: 0; text-align: center; }
  .gpi b { display: block; font-size: 21px; font-weight: 900; }
  .gpi small { display: block; margin-top: 3px; font-size: 13.5px; font-weight: 700; opacity: .7; }
  #pkGo { font-size: 18px; padding: 13px 14px; }
  .gc.flash { background: #fff36b; transform: scale(1.12); transition: transform .12s; }
  .gcard {
    flex: 1 1 100%; background: #fff; border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 0 3px 0 var(--ink);
    padding: 12px 14px; text-align: left; max-height: 36vh; overflow-y: auto; touch-action: pan-y;
    animation: popIn .35s cubic-bezier(.3,1.6,.5,1) backwards;
  }
  .gcard > b { display: block; font-size: 15px; font-weight: 900; margin-bottom: 6px; }
  .gcard ol { margin: 0; padding-left: 20px; font-weight: 700; font-size: 13.5px; line-height: 1.45; }
  .gcard li + li { margin-top: 4px; }

<script type="module">
import * as THREE from 'three';

/* ───────────────────────── туслах функцууд ───────────────────────── */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

/* ───────────────────────── renderer / camera ───────────────────────── */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
let pixelRatio = Math.min(devicePixelRatio || 1, 2);
renderer.setPixelRatio(pixelRatio);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
const LOOK_Y = 1.3;
const camBase = new THREE.Vector3();
let topY = 4, bound = 2, halfW = 3, viewOff = 0;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const dist = Math.max(9.5, 6.8 / camera.aspect);
  camBase.set(0, LOOK_Y + dist * 0.08, dist);
  camera.position.copy(camBase);
  camera.lookAt(0, LOOK_Y, 0);
  camera.setViewOffset(w, h, 0, viewOff, w, h);
  camera.updateProjectionMatrix();
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  halfW = dist * t * camera.aspect;
  topY = LOOK_Y + dist * t - 1.2;
  bound = Math.max(0.3, halfW - 1.15);
}
addEventListener('resize', resize);
resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0xffd0e0, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(3, 6, 7);
scene.add(sun);

/* ───────────────────────── материал ───────────────────────── */
const gradientMap = new THREE.DataTexture(new Uint8Array([115, 195, 255]), 3, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;

const bodyMat = new THREE.MeshToonMaterial({ color: new THREE.Color('#9fe6cc'), gradientMap });
const footMat = new THREE.MeshToonMaterial({ color: new THREE.Color('#7fd3b6'), gradientMap });
const accentMat = new THREE.MeshToonMaterial({ color: new THREE.Color('#ff8fb8'), gradientMap });
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x3b2740, side: THREE.BackSide });
const darkMat = new THREE.MeshBasicMaterial({ color: 0x2b1b30 });
const mouthMat = new THREE.MeshBasicMaterial({ color: 0x2b1b30, side: THREE.DoubleSide });
const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const irisMat = new THREE.MeshBasicMaterial({ color: 0x5a2f73 });
const earInMat = new THREE.MeshBasicMaterial({ color: 0xffa8c5 });
const leafMat = new THREE.MeshToonMaterial({ color: new THREE.Color('#7fd65a'), gradientMap });
const blushMat = new THREE.MeshBasicMaterial({ color: 0xff6f9f, transparent: true, opacity: 0, depthWrite: false });

function outlined(geo, mat, s = 1.045) {
  const m = new THREE.Mesh(geo, mat);
  const o = new THREE.Mesh(geo, outlineMat);
  o.scale.setScalar(s);
  m.add(o);
  return m;
}

/* ───────────────────────── MOODI-г бүтээх ───────────────────────── */
const root = new THREE.Group();
scene.add(root);
const bodyPivot = new THREE.Group();
root.add(bodyPivot);
const body = outlined(new THREE.SphereGeometry(1, 40, 28), bodyMat, 1.035);
body.position.y = 1.05;
bodyPivot.add(body);

// нүд
const eyes = [];
const eyeGeo = new THREE.SphereGeometry(0.17, 20, 14);
for (const side of [-1, 1]) {
  const g = new THREE.Group();
  g.position.set(side * 0.35, 0.02, 0.935);
  g.rotation.set(-0.04, side * 0.36, 0);
  g.scale.setScalar(1.2);
  const open = new THREE.Group();
  const ring = new THREE.Mesh(eyeGeo, darkMat);
  ring.scale.set(1.13, 1.3, 0.45); ring.position.z = -0.012;
  const white = new THREE.Mesh(eyeGeo, whiteMat);
  white.scale.set(1, 1.18, 0.5);
  const pupil = new THREE.Group();
  pupil.position.z = 0.068;
  const pm = new THREE.Mesh(new THREE.SphereGeometry(0.118, 18, 12), irisMat); // нил ягаан солонгон бүрхэвч
  pm.scale.set(1, 1.12, 0.42);
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 10), darkMat);
  core.scale.set(1, 1.1, 0.42); core.position.set(0, -0.008, 0.012);
  const shine = new THREE.Mesh(new THREE.SphereGeometry(0.044, 10, 8), whiteMat);
  shine.position.set(0.038, 0.052, 0.05);
  const shine2 = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 4), whiteMat);
  shine2.position.set(-0.034, -0.04, 0.05);
  const shine3 = new THREE.Mesh(new THREE.SphereGeometry(0.011, 6, 4), whiteMat);
  shine3.position.set(0.06, -0.01, 0.05);
  pupil.add(pm, core, shine, shine2, shine3);
  open.add(ring, white, pupil);
  for (let j = 0; j < 2; j++) { // сормуус ✨
    const l = new THREE.Mesh(new THREE.CapsuleGeometry(0.014, 0.06, 2, 4), darkMat);
    const a = 0.55 + j * 0.42; l.position.set(side * Math.cos(a) * 0.205, Math.sin(a) * 0.235, 0.01);
    l.rotation.z = -side * (Math.PI / 2 - a) * 1.05; open.add(l);
  }
  const arc = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.028, 6, 20, Math.PI), darkMat);
  arc.position.z = 0.05; arc.visible = false;
  g.add(open, arc);
  body.add(g);
  eyes.push({ open, pupil, arc });
}
// хөмсөг
const brows = [];
const browGeo = new THREE.CapsuleGeometry(0.028, 0.15, 3, 6);
for (const side of [-1, 1]) {
  const g = new THREE.Group();
  g.position.set(side * 0.33, 0.33, 0.9);
  g.rotation.set(-0.33, side * 0.36, 0);
  const m = new THREE.Mesh(browGeo, darkMat);
  m.rotation.z = Math.PI / 2;
  g.add(m);
  body.add(g);
  brows.push(g);
}
// хацрын улайлт
const blushGeo = new THREE.CircleGeometry(0.15, 20);
for (const side of [-1, 1]) {
  const m = new THREE.Mesh(blushGeo, blushMat);
  m.position.set(side * 0.585, -0.17, 0.796);
  m.rotation.set(0.17, side * 0.63, 0);
  m.scale.y = 0.62;
  body.add(m);
}
// ам — нэг удаа үүсгээд, зөвхөн цэгүүдийг шинэчилнэ (frame бүрт шинэ geometry үүсгэхгүй)
const MN = 20;
const mPos = new Float32Array((MN + 1) * 2 * 3);
const mIdx = [];
for (let i = 0; i < MN; i++) { const a = i * 2, b = a + 1, c = a + 2, d = a + 3; mIdx.push(a, b, c, c, b, d); }
const mouthGeo = new THREE.BufferGeometry();
mouthGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
mouthGeo.setIndex(mIdx);
const mouth = new THREE.Mesh(mouthGeo, mouthMat);
mouth.frustumCulled = false;
mouth.raycast = () => {};
const mouthG = new THREE.Group();
mouthG.position.set(0, -0.26, 0.967);
mouthG.rotation.x = 0.27;
mouthG.add(mouth);
body.add(mouthG);
const bz = (a, b, c, d, t) => { const u = 1 - t; return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d; };
let mouthKey = '';
function buildMouth(c, o, w) {
  const key = (c * 500 | 0) + ':' + (o * 500 | 0) + ':' + (w * 500 | 0);
  if (key === mouthKey) return;
  mouthKey = key;
  const hw = w / 2, cy = c * 0.07;
  const um = -c * 0.05 + o * 0.07;
  const lm = um - 0.032 - o * 0.24;
  const k = 0.35 + 0.65 * clamp(o, 0, 1);
  const ua = (4 * um - cy) / 3, la = (4 * lm - cy) / 3;
  for (let i = 0; i <= MN; i++) {
    const t = i / MN, x = bz(-hw, -hw * k, hw * k, hw, t), j = i * 6;
    mPos[j] = x; mPos[j + 1] = bz(cy, ua, ua, cy, t); mPos[j + 2] = 0;
    mPos[j + 3] = x; mPos[j + 4] = bz(cy, la, la, cy, t); mPos[j + 5] = 0;
  }
  mouthGeo.attributes.position.needsUpdate = true;
}
// антен
const antenna = new THREE.Group();
antenna.position.y = 0.96;
const stalk = outlined(new THREE.CylinderGeometry(0.026, 0.034, 0.26, 8), leafMat, 1.25);
stalk.position.y = 0.12;
antenna.add(stalk);
for (const side of [-1, 1]) { // хоёр жижиг навч
  const leaf = outlined(new THREE.SphereGeometry(0.1, 16, 10), leafMat, 1.12);
  leaf.scale.set(1.45, 0.62, 0.5); leaf.position.set(side * 0.13, 0.27, 0); leaf.rotation.z = side * 0.5;
  antenna.add(leaf);

const PLATE = (() => {

PROPS.plate = PLATE; PLATE.visible = false; // тоглоомоос гадуур таваг харагдахгүй
function gCookie() {
  const gm = GI('cookie'), cookies = PLATE.userData.cookies;
  let st = 'idle', stolen = 0, lives = 3, phase = 'sleep', phaseEnd = Infinity, fake = false;
  PLATE.visible = true; cookies.forEach(c => c.visible = true);
  const hearts = () => '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
  const score = () => setScore(`🍪 ${stolen}/10 · ${hearts()}`);
  G.targets = [PLATE];

    tipSet('😴 Moodi унтаж байна... Одоо хулгайл! 🤫');
  };
  const nextPhase = () => {
    if (phase === 'sleep') { // сэрэх гэж байгаа дохио — заримдаа хуурамч
      phase = 'stir'; fake = Math.random() < .35; S.sleeping = false;
      setEmotion('sleepy', 0, true); VOC.hmm(); phaseEnd = T + rand(.55, .9);
      tipSet('⚠️ <b>Moodi хөдөлж байна...</b> болгоомжил!');
    } else if (phase === 'stir') {
      if (fake) { sleep(); return; }
      phase = 'peek'; setEmotion('suspicious', 0, true); phaseEnd = T + rand(1, 1.9);
      say(pick(['...👀', 'Хэн бэ?', 'Хм? Юу вэ?']), 1);
      tipSet('👀 <b>Moodi харж байна! ХҮРЭХГҮЙ!</b>');
    } else if (phase === 'peek') {
      say(pick(['...зүүдэлсэн юм байх 😴', 'Юу ч алга. Унтъя...']), 1.6); sleep();
    }
  };
  const caught = (why) => {
    lives--; phase = 'caught'; phaseEnd = Infinity; S.sleeping = false; score();
    setEmotion('angry', 2.2, true); VOC.yelp(); jump(7); S.camShake = .15; buzz([40, 30, 40]); fx('💢'); fx('💢', { size: 22 });
    say(why === 'wake' ? 'Яагаад намайг сэрээсэн юм?! 😠' : pick(['ХУЛГАЙЧ!!! 😠', 'Би харчихлаа! 👀', 'Миний жигнэмэг!! 😤']), 2.2);
    tipSet(`🚨 <b>Баригдлаа!</b> ${hearts()}`);

    gLater(() => { setEmotion('sassy', 1.6, true); say('...за. Дахиад унтлаа. Битгий хүр шүү 😒', 2.2); }, 2200);
    gLater(() => sleep(2, 3.5), 3800);
  };
  const steal = () => {
    if (phase === 'peek') { caught(); return; }
    if (phase === 'caught' || stolen >= 10) return;
    stolen++; const c = cookies[10 - stolen]; c.visible = false;
    const p = c.getWorldPosition(new THREE.Vector3());
    floatSprite(emojiTex('🍪'), p, .4, .6, (f, dt, k) => { f.o.position.x -= dt * 4; f.o.position.y -= dt * 3; f.o.material.opacity = 1 - k; });

    if (stolen >= 10) finish(true);
  };
  const finish = (won) => {
    st = 'over'; phase = 'done'; S.sleeping = false;
    if (won) {
      setEmotion('shocked', 1.5, true); VOC.gasp();
      say('...Миний жигнэмэг хаана байна?! 😱', 2.4);
      gLater(() => { setEmotion('sad', 3, true); VOC.cry(); say('Бүгдийг нь идчихсэн байна... 😭', 2.6); }, 2400);
    } else {
      setEmotion('happy', 3, true); VOC.laugh(); say('Хаха, гурвуулаа баригдлаа 😎', 2.4);

      lines: [`🍪 Хулгайлсан жигнэмэг: ${stolen}/10`, won ? 'Moodi одоо уйлж байна 😭 Сэтгэл чинь зовохгүй байна уу?' : 'Moodi-гийн нүд хурц юм аа 👀'],
      again: () => startGame(gm),
    }), won ? 3200 : 1400);
  };
  G.onDown = (hit, e) => {
    if (st !== 'play') return false;
    if (hit) { steal(); return true; }
    if (pickChar(e.clientX, e.clientY) && phase !== 'caught') { caught('wake'); return true; } // Moodi-д хүрвэл сэрнэ!

}

const MOSQ_TEX = emojiTex('🦟');
function gMosquito() {
  const gm = GI('mosquito');
  let st = 'idle', score = 0, lives = 5, tEnd = 0, t0 = 0, nextSpawn = 0, scratch = 0;
  const mosq = [], bumps = [];
  let buzzO = null, buzzL = null, buzzG = null;
  const hearts = () => '❤️'.repeat(lives) + '🖤'.repeat(5 - lives);
  const showScore = () => setScore(`🦟 ${score} · ${hearts()}${st === 'play' ? ` · ⏱ ${Math.max(0, tEnd - T).toFixed(0)}с` : ''}`);
  G.lookAt = null;
  G.poseFn = () => scratch > T ? { armL: .9, fwdL: 1.8 + Math.sin(T * 30) * .2, armR: .9, fwdR: 1.8 - Math.sin(T * 30) * .2 } : null;
  const removeM = m => { scene.remove(m.s); m.s.material.dispose(); mosq.splice(mosq.indexOf(m), 1); };
  const startBuzz = () => {
    if (!AC || muted) return;
    try {
      buzzO = AC.createOscillator(); buzzO.type = 'triangle'; buzzO.frequency.value = 560;
      buzzL = AC.createOscillator(); buzzL.frequency.value = 26; const lg = AC.createGain(); lg.gain.value = 22;
      buzzL.connect(lg); lg.connect(buzzO.frequency);
      buzzG = AC.createGain(); buzzG.gain.value = 0; buzzO.connect(buzzG); buzzG.connect(AC.destination);
      buzzO.start(); buzzL.start();
    } catch (e) {}
  };
  const stopBuzz = () => { try { buzzO && buzzO.stop(); buzzL && buzzL.stop(); } catch (e) {} buzzO = buzzL = buzzG = null; };
  G.cleanup = () => { stopBuzz(); [...mosq].forEach(removeM); bumps.forEach(b => body.remove(b)); };
  const spawn = () => {
    const s = makeSprite(MOSQ_TEX, .5); const side = Math.random() < .5 ? -1 : 1;
    s.position.set(side * (halfW + .4), rand(1, 3), 1.1); scene.add(s);
    const life = Math.max(1.8, rand(2.8, 4.2) - (T - t0) * .03);
    mosq.push({ s, t0: T, bite: T + life, seed: rand(0, 99) });
  };
  const bite = m => {
    removeM(m); lives--; showScore();
    const v = new THREE.Vector3(rand(-.6, .6), rand(-.35, .55), 1).normalize();
    const b = new THREE.Mesh(new THREE.SphereGeometry(.075, 10, 8), toon('#ff5d6c'));
    b.position.copy(v.multiplyScalar(1.0)); b.userData.t0 = T; body.add(b); bumps.push(b);
    scratch = T + 1.1; setEmotion('angry', 1.4, true); VOC.ow(); buzz(30); S.camShake = .06;
    say(pick(['АЙ! Хатгачихлаа 😖', 'Загатнаж байна!!', 'Ай ай ай 😣', 'Намайг хамгаалаач!']), 1.4);
    if (lives <= 0) finish();
  };
  const swat = m => {
    const p = toScreen(m.s.position); removeM(m); score++; showScore();
    fx('💥', { at: p, size: 34, dy: -10, dx: 0, dur: 500 }); fx('пах!', { at: p, size: 22, dy: -60, dur: 600 });
    tone(900, 300, .06, 'triangle', .1); buzz(12);
    if (Math.random() < .2) { setEmotion('happy', 1, true); say(pick(['Гоё! 👏', 'Баярлалаа!', 'Ялалт! 💪']), 1); }
  };
  const finish = () => {
    if (st === 'over') return; st = 'over'; stopBuzz();
    [...mosq].forEach(m => { const p = m.s.position.clone(); removeM(m); floatSprite(MOSQ_TEX, p, .5, 1, (f, dt) => { f.o.position.y += dt * 3; f.o.position.x += dt * 2; }); });
    const survived = lives > 0;
    setEmotion(survived ? 'happy' : 'sad', 3, true); survived ? VOC.yay() : VOC.cry();
    say(survived ? 'Шумуулгүй боллоо! Баярлалаа 💚' : `${bumps.length} товруутай боллоо... 😭`, 2.6);
    gLater(() => resultCard({
      e: survived ? '🛡️' : '🦟', title: survived ? 'Moodi-г хамгаалж чадлаа!' : 'Шумуулууд яллаа...',
      lines: [`🦟 Алсан шумуул: ${score}`, `🔴 Moodi-гийн товруу: ${bumps.length} ширхэг ${bumps.length >= 4 ? '😂' : ''}`],
      again: () => startGame(gm),
    }), 1500);
  };
  G.tick = dt => {
    bumps.forEach(b => { const k = clamp((T - b.userData.t0) / .3, 0, 1); b.scale.setScalar(k > 0 ? easeBack(k) : .001); });
    if (st !== 'play') return;
    showScore();
    if (T > nextSpawn) { spawn(); nextSpawn = T + Math.max(.5, 1.5 - (T - t0) * .03); }
    let near = null, nd = 1e9;
    for (const m of [...mosq]) {
      const k = clamp((T - m.t0) / (m.bite - m.t0), 0, 1), r = 1.7 * (1 - k) + .12, a = T * 3.2 + m.seed;
      _a.set(S.x + Math.cos(a) * r + Math.sin(T * 17 + m.seed) * .08, 1.3 + Math.sin(a * 1.3) * r * .7, 1.1);

/* ═══════ 🍉 ХООЛ БАРИХ: дээрээс унах хоолыг Moodi-гийн амаар бариул ═══════ */

    } else {

/* ═══════ 🎤 MOODI-ГИЙН ХООЛОЙ: дуу авианы самбар + юу ч хэлүүлэх + чиний хоолойг дууриах ═══════ */
const BOARD = [
  ['😂', 'Инээх', 'happy', 'laugh'], ['😱', 'Хашгирах', 'shocked', 'scream'], ['😭', 'Уйлах', 'sad', 'cry'],
  ['😴', 'Хурхирах', 'sleep', 'snore'], ['🤢', 'Гэдийх', 'gross', 'burp'], ['😘', 'Үнсэх', 'love', 'mwah'],
  ['🤧', 'Найтаах', 'squish', 'sneeze'], ['😠', 'Архирах', 'angry', 'growl'], ['🎵', 'Дуулах', 'happy', 'hum'], ['🐱', 'Пүррр', 'love', 'purr'],
];
let MIC = null;
function micStop() {
  if (!MIC) return;
  try { MIC.proc.disconnect(); MIC.src.disconnect(); MIC.zero.disconnect(); } catch (e) {}
  MIC.stream.getTracks().forEach(t => t.stop());
  if (MIC.play) try { MIC.play.stop(); } catch (e) {}
  MIC = null; S.mimicAmp = 0;
}
async function micStart(onState) {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  if (AC.state !== 'running') await AC.resume();
  const src = AC.createMediaStreamSource(stream);
  const proc = AC.createScriptProcessor(2048, 1, 1);
  const zero = AC.createGain(); zero.gain.value = 0;
  src.connect(proc); proc.connect(zero); zero.connect(AC.destination);
  MIC = { stream, src, proc, zero, state: 'listen', pre: [], rec: [], silence: 0, len: 0, floor: .01, onState };
  proc.onaudioprocess = e => {
    const M = MIC; if (!M) return;
    const c = new Float32Array(e.inputBuffer.getChannelData(0)), dur = e.inputBuffer.duration;
    let s = 0; for (let i = 0; i < c.length; i += 4) s += c[i] * c[i];
    const rms = Math.sqrt(s / (c.length / 4)), thr = Math.max(.02, M.floor * 3.5);
    if (M.state === 'listen') {
      M.pre.push(c); if (M.pre.length > 6) M.pre.shift();
      if (rms < thr) M.floor = M.floor * .95 + rms * .05;
      else { M.state = 'rec'; M.rec = [...M.pre]; M.silence = 0; M.len = 0; M.onState('rec'); }
    } else if (M.state === 'rec') {
      M.rec.push(c); M.len += dur;
      M.silence = rms < thr * .6 ? M.silence + dur : 0;
      if (M.silence > .7 || M.len > 7) { M.state = 'play'; mimicPlay(M.rec, Math.round(M.silence / dur)); }
    }
  };
}
function mimicPlay(chunks, trimTail) {
  const M = MIC; if (!M) return;
  const use = chunks.slice(0, Math.max(1, chunks.length - Math.max(0, trimTail - 2)));
  const n = use.reduce((a, c) => a + c.length, 0);
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  let o = 0; use.forEach(c => { d.set(c, o); o += c.length; });
  let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(d[i]));
  const src = AC.createBufferSource(); src.buffer = buf;
  src.playbackRate.value = 1.6; // нарийн, хөөрхөн бяцхан амьтны хоолой 🐿️
  const g = AC.createGain(); g.gain.value = Math.min(4, .8 / Math.max(.05, peak));
  const an = AC.createAnalyser(); an.fftSize = 512;
  src.connect(g); g.connect(an); an.connect(muted ? AC.createGain() : AC.destination);
  M.play = src; M.an = an; M.data = new Uint8Array(an.fftSize);
  M.onState('play');
  src.onended = () => { if (MIC !== M) return; M.play = null; M.an = null; S.mimicAmp = 0; M.onState('done'); setTimeout(() => { if (MIC === M) { M.state = 'listen'; M.pre = []; M.onState('listen'); } }, 500); };
  src.start();
}
function mimicAmp() { // тоглуулж буй хоолойн чангаар амыг хөдөлгөнө
  const M = MIC; if (!M || !M.an) return 0;
  M.an.getByteTimeDomainData(M.data);
  let s = 0; for (let i = 0; i < M.data.length; i += 2) { const v = (M.data[i] - 128) / 128; s += v * v; }
  return Math.min(1, Math.sqrt(s / (M.data.length / 2)) * 4);
}
function gVoice() {
  let listening = false, earUp = false;
  G.poseFn = () => earUp ? { armR: 2.3, fwdR: .9, rz: .22, armL: .6 } : null;
  G.cleanup = () => { micStop(); };
  const mainUI = () => {
    ctl(`${BOARD.map((b, i) => `<button class="gc sm" data-v="${i}">${b[0]}<small>${b[1]}</small></button>`).join('')}

      // дэлгэцээр нааш цааш гүйж, амнаасаа гал гаргана
      if (S.walkTarget === null) { S.walkTarget = (S.x > 0 ? -1 : 1) * bound; S.walkSpeed = 6.5; }
      if (T > A.nextFx) { A.nextFx = T + 0.13; fx('🔥', { at: mouthScreen(), dx: S.walkDir * rand(60, 110), dy: rand(-40, 10), size: rand(20, 30), dur: 600 }); }
      if (T > A.nextSteam) { A.nextSteam = T + 0.5; fx('💨', { off: 0.1, size: 22, dy: -80 }); }
    }
    if (A.type === 'hyper' && S.action === A) {
      if (S.y <= 0.001 && T > A.nextHop) { A.nextHop = T + rand(.15, .4); jump(rand(6, 9.5)); S.vx = rand(-5, 5); if (Math.random() < .35) fx(pick(['⚡', '✨', '🍬', '🌈']), { size: 24 }); }
    }
    if (A.type === 'jitter' && S.action === A && T > A.nextSay) {
      A.nextSay = T + 0.85; say(pick(JITTER_SAY), 0.8);
      if (Math.random() < .5) { S.walkTarget = rand(-bound, bound); S.walkSpeed = 5; }
    }
  }

  /* удаан дарах */
  if (D && D.hit && !D.moved) {
    const held = T - D.t;
    if (held > .7 && D.stage < 1) { D.stage = 1; setEmotion('confused', 99); say(pick(LINES.hold1), 1.6); fx('❓'); }
    if (held > 2.4 && D.stage < 2) { D.stage = 2; setEmotion('shy', 99); say(pick(LINES.hold2), 2); fx('😳', { size: 22 }); }
    if (held > 4.4 && D.stage < 3) { D.stage = 3; say(pick(LINES.hold3), 2); goSleep(); }
  }
  /* илбэх */
  if (D && D.pet) {
    if (!S.purrT || T - S.purrT > 1.3) { S.purrT = T; VOC.purr(1.25); }
    if (T - S.lastHeart > 0.4) { S.lastHeart = T; fx(pick(['❤️', '💕', '💖', '✨']), { size: rand(18, 28) }); addLove(0.4); }
    if (T - S.petStart > 4.5 && !S.petTooMuch) { S.petTooMuch = true; setEmotion('shy', 99); say(pick(LINES.petTooMuch), 2); }
  }
  /* чирэх */
  if (S.dragging) {
    if (!S.shaken && !S.dragChill && T - S.dragStart > 3.5) { S.dragChill = true; setEmotion('cheerful', 99); say('...за энэ жаахан хөгжилтэй юм ✨', 2); }
    if (S.shaken && T - S.lastFx > 0.35) { S.lastFx = T; fx('💫', { size: 20 }); }
  }

  /* физик */
  if (S.dragging) {
    const tx = clamp(S.dragTo.x, -bound, bound), ty = clamp(S.dragTo.y, 0, topY);
    const k = 1 - Math.exp(-dt * 20);
    const nx = S.x + (tx - S.x) * k, ny = S.y + (ty - S.y) * k;
    S.vx = (nx - S.x) / dt; S.vy = (ny - S.y) / dt;
    S.x = nx; S.y = ny;
  } else {
    if (S.y > 0.0005 || S.vy > 0.01) {
      S.vy -= 24 * dt; S.x += S.vx * dt; S.y += S.vy * dt;
      if (S.y <= 0) {
        S.y = 0;
        const imp = -S.vy;
        S.maxImpact = Math.max(S.maxImpact, imp);
        if (imp > 2.2) {
          squash(-Math.min(imp * 0.9, 9)); S.vy = imp * 0.38; sfx.thud(imp); buzz(imp > 8 ? 30 : 10);
          if (imp > 8) { fx('💥', { at: groundScreen(), size: 30, dy: -40 }); S.camShake = Math.min(0.25, imp * 0.02); }
        } else S.vy = 0;
        S.vx *= 0.7;
      }
      if (S.y > topY) { S.y = topY; S.vy = -Math.abs(S.vy) * 0.3; }
    } else {
      S.vy = 0;
      S.vx *= Math.exp(-dt * 8); S.x += S.vx * dt;
      if (S.thrown) { S.thrown = false; onLand(S.maxImpact); S.maxImpact = 0; }
    }
    if (Math.abs(S.x) > bound) {
      const side = Math.sign(S.x); S.x = side * bound;
      if (Math.abs(S.vx) > 3) { squash(-3); sfx.thud(5); S.camShake = 0.12; if (S.thrown) fx('💥', { size: 24, dy: -30 }); }
      S.vx = -S.vx * 0.45;
    }
  }

  /* алхах */
  let walking = false;
  if (S.walkTarget !== null && !S.dragging && S.y <= 0.0005 && !S.sleeping) {
    const dx = S.walkTarget - S.x;
    if (Math.abs(dx) < 0.06) { S.walkTarget = null; S.walkSpeed = 1.6; }
    else { S.x += Math.sign(dx) * Math.min(Math.abs(dx), S.walkSpeed * dt); walking = true; S.walkDir = Math.sign(dx); }
  }

  /* утас хазайлгах → гулсана */
  let tiltG = 0;
  if (S.tiltOK && Math.abs(S.tilt) > 15) tiltG = clamp((S.tilt - Math.sign(S.tilt) * 15) / 40, -1, 1);
  if (tiltG && !S.dragging) {
    if (S.y <= 0.001) S.vx += tiltG * 14 * dt;
    if (Math.abs(tiltG) > 0.35 && T > S.tiltSayCD && !S.sleeping) {
      S.tiltSayCD = T + 4.5; markInteract(); setEmotion('shocked', 1.6); say(pick(LINES.tilt), 1.6); buzz(10);
    }
  }

  /* бөмбөг: физик + Moodi-тэй мөргөлдөх + тоглох ухаан */
  if (ball.active) {
    const bw = halfW - BR;
    if (ball.held) {
      const k = 1 - Math.exp(-dt * 25);
      const tx = clamp(ball.tx, -bw, bw), ty = clamp(ball.ty, BR, topY + 1.6);
      const nx = ball.x + (tx - ball.x) * k, ny = ball.y + (ty - ball.y) * k;
      ball.vx = (nx - ball.x) / dt; ball.vy = (ny - ball.y) / dt; ball.x = nx; ball.y = ny;
      if (!S.ballBeg && !S.sleeping && !S.turnedAway && !S.dragging) { S.ballBeg = true; setEmotion('cheerful', 99); say(pick(LINES.ballBeg), 1.6); }
    } else {
      ball.vy -= BT.g * dt; ball.vx += tiltG * 16 * dt;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      if (ball.y < BR) {
        ball.y = BR;
        if (ball.vy < -1.5) sfx.thud(Math.min(4, -ball.vy * .4));
        ball.vy = -ball.vy * BT.b; if (Math.abs(ball.vy) < 0.8) ball.vy = 0;
        ball.vx *= 0.92; ball.headers = 0; ball.userThrow = 0;
      }
      if (ball.y <= BR + 0.001) ball.vx *= Math.exp(-dt * 1.2);
      if (Math.abs(ball.x) > bw) { ball.x = Math.sign(ball.x) * bw; ball.vx = -ball.vx * 0.75; }
      if (GOAL && GOAL.visible && ball.x > bw - .08 && ball.y < 1.2 && T > (S.goalCD || 0)) onGoal(); // ГООЛ!
      if (ball.y > topY + 1.6) { ball.y = topY + 1.6; ball.vy = -Math.abs(ball.vy) * 0.5; }
      if (ball.userThrow && T - ball.userThrow > 1.5) ball.userThrow = 0;
      // Moodi-гийн биетэй мөргөлдөх
      const cy = S.y + 1.05 * bodyPivot.scale.y, R = 1.0;
      const dx = ball.x - S.x, dy = ball.y - cy, d = Math.hypot(dx, dy);
      if (d < R + BR && d > 1e-4) {
        const nx = dx / d, ny = dy / d;
        ball.x = S.x + nx * (R + BR); ball.y = cy + ny * (R + BR);
        const vn = (ball.vx - S.vx) * nx + (ball.vy - S.vy) * ny;
        if (vn < 0) {
          ball.vx -= 1.6 * vn * nx; ball.vy -= 1.6 * vn * ny;
          const imp = -vn;
          if (BT.heavy && ny > 0.45 && imp > 3 && T > S.bonkCD) { // хүнд бөмбөг толгой дээр унавал хавтгайрна 🥞
            S.bonkCD = T + 1.2; squash(-9); S.camShake = .2; buzz([40, 30, 40]); sfx.thud(8);
            setEmotion('dizzy', 2, true); VOC.ow(); say(pick(['ӨӨ... ХАВТГАЙРЛАА 🥞', 'Толгой минь!! 😵']), 1.8);
            ball.vx = (nx >= 0 ? 1 : -1) * 2.5; ball.vy = 3;
          } else if (ny > 0.45 && S.vy > 1 && !S.dragging && !BT.heavy) {
            ball.vy = Math.max(ball.vy, 8.5);
            ball.vx = clamp(ball.vx * 0.3 - ball.x * 0.5 + rand(-1.5, 1.5), -5, 5);
            ball.headers++; onHeader();
          } else if (ball.userThrow && imp > 6 && T > S.bonkCD) bonk(nx, ny);
          else if (imp > 2) { sfx.pop(); squash(-imp * 0.3); }
        }
      }
    }
    // Moodi бөмбөгийн араас гүйж, өшиглөж, толгойгоор цохино
    if (!S.dragging && !S.sleeping && !S.turnedAway && !S.action && !ball.held && S.y <= 0.001) {
      const dx = ball.x - S.x;
      // хаалга руу (баруун тийш) өшиглөхийн тулд бөмбөгний зүүн талд очиж зогсоно
      let stand = ball.x - .75; const canGoal = stand >= -bound;
      if (!canGoal) stand = ball.x + .75;
      if (Math.abs(stand - S.x) > .25 && ball.y < 2) { S.walkTarget = clamp(stand, -bound, bound); S.walkSpeed = 3.2; }
      if (T > S.headerCD && Math.abs(dx) < 0.9 && ball.y > 2 && ball.y < 4.4 && ball.vy < 0 && !BT.heavy) { S.headerCD = T + 0.9; jump(9); }
      if (T > S.kickCD && ball.y < BR + 0.08 && Math.abs(ball.vy) < 1 && Math.abs(dx) < 1.45) {
        const side = canGoal ? 1 : -1;
        if ((side > 0 && dx > 0) || (side < 0 && dx < 0)) {
          if (BT.heavy) { // боулингийн бөмбөг өшиглөвөл хөл өвдөнө
            ball.vx = side * rand(1.5, 2.5); ball.vy = rand(.5, 1.5);
            setEmotion('sad', 1.6, true); VOC.ow(); say(pick(['Хөл минь!! 🦶😭', 'Яагаад ийм хүнд юм бэ?!']), 1.6);
          } else {
            ball.vx = side * rand(5.5, 8.5); ball.vy = rand(5, 9);
            if (Math.random() < .3) say(pick(LINES.kick), 1);
          }
          S.kickT = T; S.kickSide = side; S.kickCD = T + 1.4; sfx.pop(); squash(2);
        }
      }
    }
    ballMesh.position.set(ball.x, ball.y, 0.3);
    ballMesh.rotation.z -= ball.vx * dt / BR;
    ballShadow.position.x = ball.x;
    const bs = 1 / (1 + (ball.y - BR) * 0.5);
    ballShadow.scale.set(bs, bs, 1); ballShadow.material.opacity = bs;
  }

  /* пүрш: биеийн шахалт + антен */
  S.sqV += (-S.sq * 260 - S.sqV * 14) * dt; S.sq = clamp(S.sq + S.sqV * dt, -.45, .45);
  const ax = clamp((S.vx - (S.pvx ?? S.vx)) / dt, -120, 120); S.pvx = S.vx;
  const ay = clamp((S.vy - (S.pvy ?? S.vy)) / dt, -120, 120); S.pvy = S.vy;
  const wig = (S.emotion === 'happy' || S.emotion === 'love') ? Math.sin(T * 16) * 8 : 0;
  S.antV += (-S.ant * 90 - S.antV * 5 + ax * 0.06 + wig - S.sqV * 0.4) * dt; S.ant += S.antV * dt;
  if (!Number.isFinite(S.ant + S.antV)) S.ant = S.antV = 0; // NaN болбол антен алга болдог байсан

  /* харц */
  body.getWorldPosition(_v); _v.y += 0.2; _v.project(camera);
  let gx, gy;
  if (T - S.lastPtrMove < 2.5) { gx = clamp((ptr.x - _v.x) * 1.6, -1, 1); gy = clamp((ptr.y - _v.y) * 1.6, -1, 1); }
  else {
    if (T > S.glanceUntil) { S.glance = Math.random() < .6 ? { x: 0, y: 0 } : { x: rand(-1, 1), y: rand(-.5, .6) }; S.glanceUntil = T + rand(1.2, 3); }
    gx = S.glance.x; gy = S.glance.y;
  }
  if (ball.active) {
    const hx = _v.x, hy = _v.y;
    _v.set(ball.x, ball.y, 0.3).project(camera);
    gx = clamp((_v.x - hx) * 2.2, -1, 1); gy = clamp((_v.y - hy) * 2.2, -1, 1);
  }
  if (G.lookAt) {
    body.getWorldPosition(_v); _v.y += 0.2; _v.project(camera); const hx = _v.x, hy = _v.y;
    _v.copy(G.lookAt).project(camera);
    gx = clamp((_v.x - hx) * 2.2, -1, 1); gy = clamp((_v.y - hy) * 2.2, -1, 1);
  }
  if (A && A.type === 'look') { gx = Math.sin((T - A.t0) * 2.4); gy = 0.2; }
  if (S.emotion === 'suspicious') { gx = 0; gy = 0; }
  const gk = 1 - Math.exp(-dt * 8);
  S.look.x += (gx - S.look.x) * gk; S.look.y += (gy - S.look.y) * gk;

  /* нүд анивчих */
  if (T > S.nextBlink) { S.blinkT = T; S.nextBlink = T + rand(2.2, 5); }
  const bt = (T - S.blinkT) / 0.16;
  const blink = bt < 1 ? 1 - Math.sin(bt * Math.PI) * 0.95 : 1;

  /* нүүрний параметр */
  const tgt = E[S.emotion] || E.neutral;
  const pk = 1 - Math.exp(-dt * 14);
  for (const k of NUMK) P[k] += (tgt[k] - P[k]) * pk;
  if (A && A.type === 'hyper') bodyMat.color.setHSL((T * 0.9) % 1, 0.75, 0.72); // солонго өнгө 🌈
  else bodyMat.color.lerp(G.tint || META[S.emotion].col, 1 - Math.exp(-dt * 4));

  let mOpen = P.open, mW = P.w * 0.82 * (1 - S.cheek * 0.4);
  const lo = lipOpen(); if (lo > 0) mOpen = P.open * .3 + lo * .95; // үе бүртэй синк хийсэн ам
  const ma = mimicAmp(); if (ma > .02) mOpen = Math.max(mOpen, .12 + ma);
  if (S.emotion === 'eating') mOpen = 0.1 + 0.6 * Math.abs(Math.sin(T * 9));
  if (S.emotion === 'sleep') mOpen = P.open * (0.6 + 0.4 * Math.sin(T * 1.6));
  buildMouth(P.curve, clamp(mOpen, 0, 1.1), mW);

  let px = S.look.x * 0.065, py = S.look.y * 0.06;
  switch (S.emotion) {
    case 'sassy': px = -0.05; py = 0.075; break;
    case 'dizzy': px = Math.cos(T * 9) * 0.05; py = Math.sin(T * 9) * 0.05; break;
    case 'shy': px = -0.04; py = -0.05; break;
    case 'sad': py = -0.035; break;
  }
  const style = tgt.style;
  eyes.forEach((ey, i) => {
    ey.open.visible = style === 'open';
    ey.arc.visible = style !== 'open';
    ey.arc.rotation.z = style === 'closed' ? Math.PI : 0;
    ey.open.scale.y = Math.max(0.05, P.eye * (S.sleeping ? 1 : blink));
    ey.open.scale.x = 1 + Math.max(0, P.eye - 1) * 0.5;
    ey.pupil.scale.setScalar(P.pup);
    ey.pupil.position.x = px; ey.pupil.position.y = py;
    brows[i].rotation.z = i === 0 ? -(P.brow + P.asym) : (P.brow - P.asym);
    brows[i].position.y = 0.33 + P.browY + (P.eye - 1) * 0.09;
  });
  blushMat.opacity = 0.32 + P.blush * 0.55;

  /* сэтгэл хөдлөл / үйлдэл бүрийн биеийн хөдөлгөөн */
  let bob = 0, rz = 0, ry = 0, rx = 0, sx = 1, sy = 1 + Math.sin(T * 2.2) * 0.015, ez = 0;
  let armL = 0.45, armR = 0.45, fwdL = 0, fwdR = 0;
  switch (S.emotion) {
    case 'happy': bob = Math.abs(Math.sin(T * 8)) * 0.1; armL = armR = 2.3 + Math.sin(T * 16) * 0.3; rz = Math.sin(T * 8) * 0.06; break;
    case 'cheerful': bob = Math.abs(Math.sin(T * 5)) * 0.04; armL = armR = 0.8; break;
    case 'angry': rz = Math.sin(T * 40) * 0.03; armL = armR = 1.1 + Math.sin(T * 30) * 0.25; sy -= 0.04; sx += 0.03; break;
    case 'shocked': sy += 0.08; sx -= 0.04; armL = armR = 2.6; rz = Math.sin(T * 50) * 0.01; break;
    case 'shy': ry = -0.45; rz = 0.08; armL = armR = 0.7; fwdL = fwdR = 1.9; break;
    case 'sad': sy -= 0.08; bob = -0.04; rx = 0.2; armL = armR = 0.15; break;
    case 'sleepy': rx = 0.12 + Math.sin(T * 1.3) * 0.05; rz = Math.sin(T * 0.9) * 0.06; armL = armR = 0.25; break;
    case 'sleep': sy += Math.sin(T * 1.6) * 0.04 - 0.06; sx += 0.03; rx = 0.22; rz = 0.14; armL = armR = 0.2; break;
    case 'confused': rz = 0.25; armR = 1.9 + Math.sin(T * 12) * 0.15; fwdR = 0.8; break;
    case 'sassy': ry = 0.6; rz = -0.08; armL = armR = 0.95; break;
    case 'dizzy': rz = Math.sin(T * 3) * 0.2; rx = Math.cos(T * 3) * 0.1; armL = 1 + Math.sin(T * 3) * 0.5; armR = 1 - Math.sin(T * 3) * 0.5; break;
    case 'love': bob = Math.abs(Math.sin(T * 4)) * 0.06; rz = Math.sin(T * 4) * 0.09; armL = armR = 0.8; fwdL = fwdR = 0.9; break;
    case 'squish': sy += 0.06; armL = armR = 1.3; break;
    case 'suspicious': rx = 0.16; ez = 0.6; sy -= 0.05; armL = armR = 0.3; break;
    case 'eating': sy += Math.sin(T * 18) * 0.03; armL = armR = 1.2; fwdL = fwdR = 1.2; break;
    case 'drag': armL = armR = 2.7 + Math.sin(T * 20) * 0.3; break;
    case 'spicy': rz = Math.sin(T * 30) * 0.05; sy += Math.sin(T * 25) * 0.03; armL = 2.4 + Math.sin(T * 22) * 0.5; armR = 2.4 - Math.sin(T * 22) * 0.5; break;
    case 'sour': sx -= 0.12; sy += 0.08 + Math.sin(T * 45) * 0.02; rz = Math.sin(T * 40) * 0.04; armL = armR = 0.2; break;
    case 'hyper': armL = armR = 2.5 + Math.sin(T * 25) * 0.4; rz = Math.sin(T * 12) * 0.15; break;
    case 'jitter': rz = Math.sin(T * 70) * 0.03; armL = armR = 1 + Math.sin(T * 50) * 0.12; break;
    case 'freeze': rz = Math.sin(T * 60) * 0.025; sy -= 0.05; armL = armR = 2.6; fwdL = fwdR = 0.7; break;
    case 'gross': ry = 0.75; rx = -0.08; armL = armR = 0.9; fwdL = fwdR = 1.4; break;
  }
  if (ball.held && S.ballBeg) { armL = armR = 2.5 + Math.sin(T * 14) * 0.3; bob = Math.abs(Math.sin(T * 9)) * 0.06; }
  const pf = G.poseFn || (T < (S.hpUntil || 0) ? S.hp : null);
  if (pf) { // тоглоом эсвэл гэрийн үйлдлийн үеийн биеийн байрлал
    const p = pf() || {};
    if (p.armL != null) armL = p.armL; if (p.armR != null) armR = p.armR;
    if (p.fwdL != null) fwdL = p.fwdL; if (p.fwdR != null) fwdR = p.fwdR;
    if (p.rx != null) rx = p.rx; if (p.ry != null) ry = p.ry; if (p.rz != null) rz = p.rz;
    if (p.ez != null) ez = p.ez; if (p.bob != null) bob = p.bob; if (p.sx) sx += p.sx; if (p.sy) sy += p.sy;
  }
  if (A) {
    const at = T - A.t0;
    if (A.type === 'wave') { armR = 2.6 + Math.sin(at * 12) * 0.45; rz = -0.08; }
    if (A.type === 'dance') {
      bob = Math.abs(Math.sin(T * 7)) * 0.16; rz = Math.sin(T * 3.5) * 0.18; ry = Math.sin(T * 3.5) * 0.3;
      armL = 1.4 + Math.sin(T * 7) * 1.1; armR = 1.4 - Math.sin(T * 7) * 1.1;
    }
    if (A.type === 'teeter' && A.phase === 'wobble') {
      rz = -A.dir * (0.25 + Math.sin(T * 9) * 0.2); armL = 2.2 + Math.sin(T * 18) * 0.6; armR = 2.2 - Math.sin(T * 18) * 0.6;
    }
  }
  if (D && D.pet) { sy -= 0.07 + Math.sin(T * 10) * 0.03; sx += 0.04; }
  if (T < S.petPress) { sy -= 0.05 + Math.sin(T * 10) * 0.03; }
  if (D && D.hit && !D.moved) { sy -= 0.05; sx += 0.03; }
  if (walking) bob += Math.abs(Math.sin(T * 14)) * 0.05;
  if (S.belly) { sx += S.belly * .22; sy -= S.belly * .05; } // идсэн хоолоор гэдэс нь томорно
  const airborne = S.dragging || S.y > 0.02;
  if (S.dragging) { const sp = Math.min(Math.hypot(S.vx, S.vy) * 0.01, 0.15); sy += 0.12 + sp; sx -= 0.06 + sp * 0.5; }
  else if (S.y > 0.02 && S.emotion !== 'happy') { armL = Math.max(armL, 2.2); armR = Math.max(armR, 2.2); }

  /* эргэлт */
  let spin = 0;
  if (S.spinT) { const p = (T - S.spinT) / 0.9; if (p < 1) spin = (1 - Math.pow(1 - p, 3)) * Math.PI * 2; else S.spinT = 0; }

  /* transform-уудыг хэрэглэх */
  let face = 0;
  if (S.turnedAway) face = Math.PI;
  else if (walking) face = S.walkDir * 0.6;
  S.faceY += (face - S.faceY) * (1 - Math.exp(-dt * 8));
  const jit = S.emotion === 'jitter' || S.emotion === 'freeze' ? 0.03 : 0;
  root.position.set(S.x + (jit ? rand(-jit, jit) : 0), S.y + Math.max(bob, -0.06), ez * 0.6);
  root.rotation.y = S.faceY + spin;

  const lean = clamp(-S.vx * 0.04, -0.5, 0.5);
  bodyPivot.rotation.z = rz + lean;
  bodyPivot.rotation.x = S.dragging ? clamp(S.vy * 0.02, -.3, .3) : 0;
  bodyPivot.scale.set(sx * (1 - S.sq * 0.5), sy * (1 + S.sq), sx * (1 - S.sq * 0.5));
  body.scale.set(1 - S.cheek * 0.12, 1 + S.cheek * 0.05, 1);
  body.rotation.y = S.look.x * 0.32 + ry;
  body.rotation.x = -S.look.y * 0.16 + rx;

  antenna.rotation.z = clamp(S.ant, -0.9, 0.9);
  antenna.rotation.x = clamp(-ay * 0.004, -0.5, 0.5);

  const ak = 1 - Math.exp(-dt * 12);
  arms.forEach(a => {
    const tz = a.side < 0 ? armL : armR, tx = a.side < 0 ? fwdL : fwdR;
    a.z += (tz - a.z) * ak; a.x += (tx - a.x) * ak;
    a.g.rotation.z = a.side * a.z;
    a.g.rotation.x = -a.x;
  });
  feet.forEach((f, i) => {
    if (airborne) {
      f.g.position.y = 0.04;
      f.g.rotation.x = Math.sin(T * (S.dragging ? 16 : 10) + i * Math.PI) * 0.6;
    } else {
      const lift = walking ? Math.max(0, Math.sin(T * 14 + i * Math.PI)) * 0.14
        : (A && A.type === 'dance') ? Math.max(0, Math.sin(T * 7 + i * Math.PI)) * 0.12 : 0;
      f.g.position.y = 0.11 + lift - Math.min(bob, 0.12);
      f.g.rotation.x = -lift * 1.5;
      // өшиглөх хөдөлгөөн
      const kp = (T - S.kickT) / 0.3;
      if (kp < 1 && (i === 0 ? -1 : 1) === S.kickSide) { const kk = Math.sin(kp * Math.PI); f.g.position.y += kk * 0.18; f.g.rotation.x = -kk * 1.3; }
    }
  });

  shadow.position.x = S.x;
  const ss = 1 / (1 + S.y * 0.45);
  shadow.scale.set(ss * (1 - S.sq * 0.3), ss, 1);
  shadowMat.opacity = ss;

  /* тоглоомын frame бүрийн логик */
  if (G.tick) G.tick(dt);
  updateFloaters(dt);

  /* (хуучин) камерын шилжилт */
  const vt = G.viewOff || 0;
  if (Math.abs(vt - viewOff) > 0.3) {
    viewOff += (vt - viewOff) * (1 - Math.exp(-dt * 7));
    camera.setViewOffset(innerWidth, innerHeight, 0, viewOff, innerWidth, innerHeight); camera.updateProjectionMatrix();
  }

  /* камер чичиргээ */
  if (S.camShake > 0.001) {
    S.camShake *= Math.exp(-dt * 10);
    camera.position.set(camBase.x + rand(-1, 1) * S.camShake, camBase.y + rand(-1, 1) * S.camShake, camBase.z);
  } else if (S.camShake) { S.camShake = 0; camera.position.copy(camBase); }

  /* ярианы бөмбөлөг толгойг дагана (layout унших шаардлагагүй) */
  if (bubble.classList.contains('on')) {
    const h = headScreen(0.55 + (G.bubbleLift || 0));
    const left = clamp(h.x, S.bw / 2 + 12, innerWidth - S.bw / 2 - 12);
    const top = Math.max(h.y, S.bh + 74);
    bubble.style.transform = `translate3d(${left}px, ${top}px, 0) translate(-50%, -100%)`;
    bi.style.setProperty('--tx', clamp(h.x - left, -S.bw / 2 + 20, S.bw / 2 - 20) + 'px');
  }
  /* заавар хуруу */
  if (coachOn) {
    const g = groundScreen();
    coach.style.transform = `translate3d(${g.x}px, ${g.y + 6}px, 0) translate(-50%, 0)`;
  }
}

/* ───────────────────────── эхлэл + loop ───────────────────────── */
function intro() {
  // өдөр бүр ирсэн дараалал (🔥 streak)
  const today = dayKey(), last = store.get('moodi-last', ''), gap = last ? daysBetween(last, today) : -1;
  STREAK = gap === 0 ? STREAK : gap === 1 ? STREAK + 1 : 1;
  store.set('moodi-last', today); store.set('moodi-streak', STREAK);
  const openLater = (fn, ms) => setTimeout(() => { if (!S.gameOpen) fn(); }, ms); // хэрэглэгч оролдсон ч цуцлагдахгүй
  const coachLater = ms => later(() => { if (!coachDone && hintCount === 0 && !S.gameOpen) { coachOn = true; coach.classList.add('on'); } }, ms);
  const flow = () => { // захиа/танилцах/төрсөн өдрийн дараа ердийн урсгал
    if (!ME.met) return meetScene(flow);
    if (ME.bd === today.slice(5) && store.get('moodi-bdayDone', '') !== today) return partyScene(() => { if (!MOODLOG[dayKey()]) setTimeout(moodScene, 800); });
    if (!MOODLOG[dayKey()]) moodScene();
  };
  if (LETTER) { openLater(() => receiveScene(LETTER, () => setTimeout(() => { if (!S.gameOpen) flow(); }, 900)), 1300); return; }
  const due = inboxDue();
  if (due) { // 🔒 хүлээж байсан захиа өнөөдөр нээгдлээ!
    later(() => { setEmotion('hyper', 2); say('🔓 Түгжээтэй захиа чинь өнөөдөр нээгдлээ!!', 2.2); jump(6); }, 900);
    openLater(() => receiveScene(due, () => setTimeout(() => { if (!S.gameOpen) flow(); }, 900)), 3300); return;
  }
  if (!ME.met) { // анх удаа: ичимхий мэндчилгээ → танилцах
    later(() => { setEmotion('shocked', 1.2); sfx.boing(); jump(6); }, 900);
    later(() => { setEmotion('shy', 2.2); say('...хай? 👋', 1.6); }, 1700);
    later(() => { setEmotion('love', 2.4); say('Би Moodi. Чиний шинэ bestie 🌱✨', 2); }, 3300);
    later(() => { setEmotion('shy', 2); say('Чи хэн бэ, bestie? 🥺', 1.6); }, 5300);
    openLater(flow, 6900); return;
  }
  const nm = userName || 'найз минь', isBday = ME.bd === today.slice(5);
  const lines = [];
  if (isBday) lines.push(['hyper', `${nm}!! Өнөөдөр ЧИНИЙ ӨДӨР!! 🎂`]);
  else if (gap >= 3) lines.push(['sad', `${nm}!! ${gap} өдөр ghost хийсэн үү?! 😭`], ['love', 'Чамайг маш их санасан, no cap 🥺💕']);
  else if (gap === 0) lines.push(['happy', pick([`${nm}! Дахиад ирлээ? lowkey баярлалаа 😆`, `Өө, ${nm}! Санасан шүү 😊`])]);
  else lines.push(['happy', pick([`${nm}!! Ирчихлээ шүү дээ 💕`, `Хай ${nm}! 👋✨`, `${nm}! Чамайг хүлээж байлаа 🥰`])]);
  if (gap === 1 && STREAK >= 2) lines.push(['cheerful', `🔥 ${STREAK} өдрийн streak! Чи бол GOAT 🐐`]);
  const dl = daysToBday();
  if (dl > 0 && dl <= 7) lines.push(['hyper', `Төрсөн өдөр чинь ${dl} хоногийн дараа!! 🎂`]);
  const ym = MOODLOG[dayKey(new Date(Date.now() - 864e5))];
  if (gap === 1 && MOODQ[ym]) lines.push(['sad', MOODQ[ym]]);
  let at = 1100;
  lines.forEach(([e, t], i) => { later(() => { setEmotion(e, 2.2); say(t, 2.2); if (i === 0) { sfx.boing(); jump(6); } }, at); at += 2400; });
  if (isBday && store.get('moodi-bdayDone', '') !== today || !MOODLOG[today]) openLater(flow, at + 200);
  else { later(() => { S.walkTarget = pick([-1, 1]) * bound * 0.85; S.walkSpeed = 4.5; S.nextIdle = T + 6; }, at); coachLater(at + 1500); }
}

let ftAcc = 0, ftN = 0, frames = 0;
function frame() {
  requestAnimationFrame(frame);
  const raw = clock.getDelta();
  const dt = Math.min(raw, 1 / 20);
  T += dt;
  update(dt);
  renderer.render(scene, camera);
  if (S.afterRender) { const f = S.afterRender; S.afterRender = null; f(); }
  if (S.snapPending) { S.snapPending = false; try { showPhoto(capture()); } catch (e) { say('зураг авч чадсангүй 😢', 1.6); } }
  // сул утсан дээр pixel ratio-г автоматаар бууруулна
  if (++frames > 120) {
    ftAcc += raw; ftN++;
    if (ftN === 90) {
      if (ftAcc / ftN > 0.024 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); }
      ftAcc = 0; ftN = 0;
    }
  }
  if (frames === 2) setTimeout(() => $('#splash').classList.add('out'), 350);
}
window.__moodiOK = true;
renderer.compile(scene, camera);
intro();
frame();
</script>

  setTimeout(() => {
    if (!window.__moodiOK) document.getElementById('splashTxt').textContent = 'ачаалж чадсангүй 😢 интернэтээ шалгаарай';
  }, 7000);
</script>
